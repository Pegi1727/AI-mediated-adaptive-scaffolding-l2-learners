name: Reproducibility test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  python-stats:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Verify input data files
        run: |
          test -f data/Full_Raw_Data.xlsx
          test -f data/pre_post_scores_full_50students.csv
          test -f data/questionnaire_post_intervention_corrected.csv

      - name: Run Python test suite
        run: pytest -v

      - name: Reproduce statistical pipeline
        run: |
          python python/01_import_validate.py
          python python/02_prepare_achievement.py
          python python/03_descriptives.py
          python python/04_assumption_tests.py
          python python/05_inferential_analysis.py
          python python/06_tables_figures_report.py

      - name: Verify key outputs were regenerated
        run: |
          test -s outputs/validation_report.csv
          test -s outputs/inferential_results.csv
          test -s outputs/report_summary.csv

      - name: Upload reproduced outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reproduced-outputs-py${{ matrix.python-version }}
          path: |
            outputs/
            figures/
          if-no-files-found: warn
